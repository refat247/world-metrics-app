name: Release Branding Gate v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-release-brand-assets.py'
      - '.github/workflows/release-brand-assets-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset generator dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate production launcher and splash assets
        run: python scripts/generate-release-brand-assets.py

      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit source and provenance
        run: npm run audit

      - name: Verify branded release markers
        shell: bash
        run: |
          grep -q 'data-app-version="1.0.3"' www/index.html
          grep -q 'versionCode 4' android/app/build.gradle
          grep -q 'versionName "1.0.3"' android/app/build.gradle
          grep -q '#0B1118' android/app/src/main/res/values/ic_launcher_background.xml
          test -s artifacts/store/google-play-icon-512.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-port-xxxhdpi/splash.png

      - name: Sync canonical Android project
        run: npx cap sync android

      - name: Build branded debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build branded release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify build artifacts
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          sha256sum "$APK" "$AAB"

      - name: Upload branded debug APK
        uses: actions/upload-artifact@v4
        with:
          name: world-metrics-v1.0.3-branded-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload branded unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: world-metrics-v1.0.3-branded-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Commit branded production source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/res android/app/build.gradle
          git add artifacts/store www/index.html www/service-worker.js package.json package-lock.json scripts/static-audit.mjs
          if git diff --cached --quiet; then
            echo 'No branding delta to commit.'
          else
            git commit -m 'Apply World Metrics release branding v1.0.3'
            git push origin HEAD:main
          fi
