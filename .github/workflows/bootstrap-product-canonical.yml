name: Bootstrap product canonical

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize from pinned Grok canonical
        run: python scripts/bootstrap_from_grok.py

      - name: Keep workflow files unchanged for the bootstrap push
        run: |
          git restore --source=HEAD -- .github/workflows/bootstrap-product-canonical.yml
          rm -f .github/workflows/ci.yml

      - name: Audit generated product tree
        run: npm run audit

      - name: Commit PRODUCT-CANONICAL v1.0.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize World Metrics PRODUCT-CANONICAL v1.0.0"
          git push origin HEAD:main
