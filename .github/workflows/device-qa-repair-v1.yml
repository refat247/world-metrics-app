name: Device QA Repair Gate v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/device-qa-repair-v1.py'
      - '.github/workflows/device-qa-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic device repair
        run: python scripts/device-qa-repair-v1.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run strengthened production audit
        run: npm run audit

      - name: Verify repair markers
        shell: bash
        run: |
          grep -q 'data-app-version="1.0.1"' www/index.html
          grep -q 'setGlobePreviewScale' www/index.html
          grep -q '__worldMetricsHandleBack' www/index.html
          grep -q 'OnBackPressedCallback' android/app/src/main/java/app/worldmetrics/mobile/MainActivity.java
          grep -q 'versionCode 2' android/app/build.gradle
          grep -q 'versionName "1.0.1"' android/app/build.gradle

      - name: Commit repaired canonical source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/index.html www/service-worker.js package.json package-lock.json scripts/static-audit.mjs
          git add android/app/build.gradle android/app/src/main/java/app/worldmetrics/mobile/MainActivity.java
          if git diff --cached --quiet; then
            echo 'No repair delta to commit.'
          else
            git commit -m 'Apply Device QA Repair v1'
            git push origin HEAD:main
          fi
