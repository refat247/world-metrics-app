name: Android Build Gate v1

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'www/**'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/android-debug-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Audit web app and Grok provenance
        run: npm run audit

      - name: Generate Android project when absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p build-artifacts
          cp "$APK" build-artifacts/world-metrics-debug.apk
          sha256sum build-artifacts/world-metrics-debug.apk | tee build-artifacts/world-metrics-debug.apk.sha256
          ls -lh build-artifacts/world-metrics-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: world-metrics-debug-apk
          path: |
            build-artifacts/world-metrics-debug.apk
            build-artifacts/world-metrics-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Promote generated Android project and dependency lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.gitignore')
          lines = p.read_text().splitlines()
          lines = [line for line in lines if line.strip() != 'android/']
          p.write_text('\n'.join(lines).rstrip() + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore package-lock.json
          git add -f android
          git reset -- android/.gradle android/app/build android/build 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No native-source changes to commit.'
          else
            git commit -m 'Promote Android native project after successful debug build'
            git push origin HEAD:main
          fi
