name: Android Release Bundle Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-bundle.yml'
      - 'android/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit source and provenance
        run: npm run audit

      - name: Sync canonical Android project
        run: npx cap sync android

      - name: Build release app bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify release bundle container
        shell: bash
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          sha256sum "$AAB"
          ls -lh "$AAB"

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: world-metrics-v1.0.2-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
